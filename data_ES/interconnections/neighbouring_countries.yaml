##################################################
#
# Neighbouring countries reachable through the electrical interconnections
# defined in <interconnections.yaml>.
#
# Each country is represented only by its hourly market price. There is no
# country bus, no country generator and no foreign demand: every interconnection
# gets its own pair of market generators at the border bus (see
# <interconnections.yaml> and <prepare_network.py>).
#
# Fields per country:
#
#   prices   CSV with the hourly market price of the country, in EUR/MWhe.
#            First column is a datetime index, second column the price. The year
#            of that index is the year the series corresponds to; it is mapped
#            onto n.snapshots by (month, day, hour), so if it does not match the
#            year of the snapshots a warning is logged and the series is used
#            anyway: keeping both years coherent is the user's responsibility.
#
#   spread   Bid-ask spread in EUR/MWh, applied symmetrically:
#                import marginal cost = +(price(t) + spread / 2)
#                export marginal cost = -(price(t) - spread / 2)
#            A round trip therefore costs 'spread' EUR/MWh, which removes the
#            degenerate optimum of importing and exporting in the same hour and
#            represents transaction costs. Set to 0 to reproduce the behaviour of
#            the previous country-bus model. This is the only place where the
#            spread is defined.
#
##################################################


########## France

FR:
  prices: data_ES/interconnections/ic_market_prices/mp_FR_2030_cutout2023.csv
  spread: 0


########## Portugal

PT:
  prices: data_ES/interconnections/ic_market_prices/mp_PT_2030_cutout2023.csv
  spread: 0
