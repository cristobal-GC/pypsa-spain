##################################################
#
# Electrical interconnections between Spain and its neighbouring countries.
#
# Each entry defines one interconnection. In <prepare_network.py>, for each entry:
#
#   - A border bus 'bus_name' is added at (x, y), with carrier 'DC_ic' and
#     country 'ES'.
#
#   - Two unidirectional links connect the border bus with the closest AC bus of
#     the Spanish network: the export one flows ES -> border and the import one
#     border -> ES, each with the p_nom given below (NTC of that direction).
#
#   - Two market generators are attached to the border bus:
#       import  sign=+1, marginal_cost = +(price(t) + spread/2)
#       export  sign=-1, marginal_cost = -(price(t) - spread/2)
#     so that importing costs money and exporting earns money. There is no
#     neighbouring-country bus and no foreign demand: the objective function only
#     contains the Spanish system cost plus purchases minus export revenues.
#
# Prices and spread per country are defined in <neighbouring_countries.yaml>.
#
# Fields per entry:
#
#   bus_name    Name of the border bus. Component names are declared explicitly
#               rather than derived from the entry key, so that they can carry
#               the name of the real project.
#   country     Key in <neighbouring_countries.yaml> providing the price series.
#   x, y        Coordinates of the border bus (lon, lat in degrees).
#   length      Length of the Spanish side of the link, in km. Taken verbatim
#               from here, never recomputed from the bus coordinates: the border
#               bus sits at the physical crossing point while the Spanish bus is
#               a cluster centroid, so their distance is not the line length.
#               It drives the HVDC transmission cost, see 'underwater_fraction'.
#   efficiency  Per-unit efficiency of both links. Computed as
#                   0.98 * 0.977 ** (length / 1000)
#               which reproduces the values that PyPSA-Eur's
#               'sector: transmission_efficiency: DC_ic' used to apply in the
#               sector stage. Set to 1 to model lossless interconnections.
#   underwater_fraction
#               Share of 'length' running under water, from 0 to 1. It splits the
#               cable cost between the 'HVDC overhead' and 'HVDC submarine' rows
#               of costs.csv, on top of a fixed 'HVDC inverter pair' cost per MW.
#               Note that costs.csv also has an 'HVDC underground' row, much more
#               expensive than overhead, but set_transmission_costs only
#               interpolates between overhead and submarine, so underground
#               stretches are inevitably priced as overhead.
#               The cost is charged on the export link only: both links model the
#               two directions of the same physical asset, so charging both would
#               pay twice for the cable and for the converter stations.
#   export/import:
#     link_name       Name of the link between the Spanish grid and the border bus.
#     generator_name  Name of the market generator at the border bus.
#     p_nom           Net transfer capacity in that direction, in MW.
#     e_sum_max       Optional cap on the annual energy exchanged in that
#                     direction, in TWh/year. Leave empty for no limit. Scaled
#                     internally by the length of the optimization horizon.
#
##################################################


################################################## ES - FR ##################################################


########## Interconnection ES-FR0

### SOURCE: https://www.ree.es/es/actividades/proyectos-singulares/nueva-interconexion-electrica-con-francia
# 2800 MW
# DC
# 320 kV
# 64.5 km (30 km ES, 26 km FR, 8.5 km túnel)
# 700 mill. EUR
# Enlaza los municipios de Santa Llogaia, cerca de Figueres (España), con Baixas, próximo a Perpiñán (Francia). Trazado soterrado en zanja de hormigón menos el túnel de 8,5 kilómetros que atraviesa los Pirineos (paralelo a la línea ferroviaria de alta velocidad). Tiene su entrada y salida en los términos municipales de La Jonquera (España) y Montesquieu des Albères (Francia).
# En 2015 la capacidad se duplica (de 1400 MW a 2800 MW)

ES FR0:

  bus_name: ES FR0

  country: FR

  x: 2.877482
  y: 42.426598

  length: 34.25   ### km, ES side
  efficiency: 0.979219   ### 0.98 * 0.977 ** (34.25 / 1000)
  underwater_fraction: 0   ### underground trench plus a tunnel, priced as overhead

  export:
    link_name: ES FR0 export
    generator_name: ES FR0 market export
    p_nom: 2800
    e_sum_max:

  import:
    link_name: ES FR0 import
    generator_name: ES FR0 market import
    p_nom: 2800
    e_sum_max:


########## Interconnection ES-FR1

### SOURCE: https://www.ree.es/es/actividades/proyectos-singulares/interconexion-electrica-submarina-con-francia
# 5000 MW
# DC
# 400 km (300 km subterráneos)
# 2.800 mill. EUR (https://www.levante-emv.com/economia/2024/02/13/pacto-espana-francia-impulsar-interconexiones-98140681.html)
# La nueva interconexión entre la subestación de Gatika (cerca de Bilbao) y la subestación de Cubnezais (en la región francesa de Aquitania)
# Operativa a partir de 2028

ES FR1:

  bus_name: ES FR1

  country: FR

  x: -2.858534
  y: 43.364801

  length: 200   ### km, ES side
  efficiency: 0.975450   ### 0.98 * 0.977 ** (200 / 1000)
  underwater_fraction: 1   ### submarine interconnection (Gatika - Cubnezais)

  export:
    link_name: ES FR1 export
    generator_name: ES FR1 market export
    p_nom: 2000
    e_sum_max:

  import:
    link_name: ES FR1 import
    generator_name: ES FR1 market import
    p_nom: 2000
    e_sum_max:


