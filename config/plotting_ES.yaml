#################### PyPSA-Spain
#
# PyPSA-Spain deviations from config/plotting.default.yaml.
#
# That file is kept IDENTICAL to upstream on purpose. It is an upstream default: upstream
# rewrites it on every release cycle (+410/-433 lines in v2026.09) and now validates that
# it matches its own pydantic schema (test_plotting_default_yaml_in_sync). Keeping the
# deviations here means that file never conflicts on an update, and the test passes
# without excluding anything.
#
# Loaded by the Snakefile right after config_ES.yaml, so it overrides the upstream
# plotting defaults while a local config/config.yaml and --configfile still win over it.
#
# Contents:
#   - map boundaries, cropped to the Iberian peninsula
#   - carrier lists reduced to the ones used by the Spanish case
#   - nice_names and tech_colors for the fork's own carriers: DC_ic* and H2_ic*
#
####################

plotting:

  # Map extent cropped to the Iberian peninsula (upstream: [-11, 30, 34, 71]).
  map:
    boundaries:
    - -14
    - 6.35
    - 35
    - 46.3

  # Carrier lists below are reduced to the ones the Spanish case actually uses, so the
  # plots do not fill up with empty panels. Upstream keeps the full lists.
  balance_timeseries:
    carriers:
    - H2
    carrier_groups:
      electricity:
      - AC
      - low voltage
  heatmap_timeseries:
    marginal_price:
    - AC
    - H2
    utilisation_rate:
    - solar
    - solar rooftop
    - solar-hsat
    - onwind
    - offwind-float
    - ror
    - hydro
    - PHS
    - battery charger
    - battery discharger
    - H2 Electrolysis
    - OCGT
    - H2 Fuel Cell
    - DAC
    soc:
    - battery
    - H2 Store
    - gas
  balance_map:
    bus_carriers:
    - AC
    - H2
  balance_map_interactive:
    bus_carriers:
    - AC
    - H2

  # Labels and colours for the fork's own carriers: the Spanish electrical
  # interconnections (DC_ic*) and the cross-border hydrogen points (H2_ic*).
  nice_names:
    DC_ic: Interconnections
    DC_ic export: Interconnections
    DC_ic import: Interconnections
    DC_ic market export: Electricity exports
    DC_ic market import: Electricity imports
  tech_colors:
    DC_ic: '#8a1caf'
    DC_ic export: '#9B30FF'
    DC_ic import: '#A020F0'
    DC_ic market export: '#6a67a3'
    DC_ic market import: '#b5a8d5'
    H2_ic: '#bf13a0'
    H2_ic export: '#9b1f86'
    H2_ic import: '#db8ccd'
