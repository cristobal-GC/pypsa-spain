#################### PyPSA-Spain
#
# Desviaciones de PyPSA-Spain sobre config/plotting.default.yaml.
#
# Ese fichero se mantiene IDENTICO a upstream a proposito: es un default suyo, lo
# reescribe en cada ciclo (en v2026.09 fueron +410/-433 lineas) y upstream valida que
# coincida con su esquema pydantic (test_plotting_default_yaml_in_sync). Manteniendo
# aqui las desviaciones, ese fichero deja de ser fuente de conflictos en cada
# actualizacion y el test pasa sin excluir nada.
#
# Contenido:
#   - limites del mapa, recortados a la peninsula iberica
#   - listas de carriers reducidas a los que usa el caso espanol
#   - nice_names y tech_colors de los carriers propios: DC_ic* y H2_ic*
#
####################

plotting:
  map:
    boundaries:
    - -14
    - 6.35
    - 35
    - 46.3
  balance_timeseries:
    carriers:
    - H2
    carrier_groups:
      electricity:
      - AC
      - low voltage
  heatmap_timeseries:
    marginal_price:
    - AC
    - H2
    utilisation_rate:
    - solar
    - solar rooftop
    - solar-hsat
    - onwind
    - offwind-float
    - ror
    - hydro
    - PHS
    - battery charger
    - battery discharger
    - H2 Electrolysis
    - OCGT
    - H2 Fuel Cell
    - DAC
    soc:
    - battery
    - H2 Store
    - gas
  balance_map:
    bus_carriers:
    - AC
    - H2
  balance_map_interactive:
    bus_carriers:
    - AC
    - H2
  nice_names:
    DC_ic: Interconnections
    DC_ic export: Interconnections
    DC_ic import: Interconnections
    DC_ic market export: Electricity exports
    DC_ic market import: Electricity imports
  tech_colors:
    DC_ic: '#8a1caf'
    DC_ic export: '#9B30FF'
    DC_ic import: '#A020F0'
    DC_ic market export: '#6a67a3'
    DC_ic market import: '#b5a8d5'
    H2_ic: '#bf13a0'
    H2_ic export: '#9b1f86'
    H2_ic import: '#db8ccd'
